name: Tâche quotidienne
# Loan reminders + cleanup. Free alternative to a hosted cron job: GitHub calls the endpoint once a day.
# Repository secrets needed: APP_URL (https://okoume.onrender.com) and CRON_SECRET (same value as on Render).
on:
  schedule: [{ cron: "17 11 * * *" }] # 11:17 UTC, early morning in Montréal
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/cron/daily
        run: |
          # A free Render instance may be asleep: the first call wakes it up.
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/daily"
